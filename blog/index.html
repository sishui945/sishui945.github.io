<!DOCTYPE html>
<html lang="zh-CN" style="scroll-behavior: smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博客 | 似水Sishui</title>
</head>

<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-sans antialiased">

  <!-- ========== 导航栏 ========== -->
  <header class="bg-white/80 dark:bg-gray-900/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-200/60 dark:border-gray-700/60">
    <nav class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center" aria-label="主导航">
      <!-- Logo -->
      <a href="/" class="flex items-center gap-2 group">
        <img src="/src/assets/logo.png" alt="似水Sishui 头像" class="w-8 h-8 rounded-md">
        <span class="text-lg font-bold text-gray-900 dark:text-white group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">似水Sishui</span>
      </a>

      <!-- 桌面端链接 -->
      <ul class="hidden md:flex items-center space-x-8 text-sm">
        <li><a href="/#home"     class="text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 font-medium transition-colors duration-200">首页</a></li>
        <li><a href="/#about"    class="text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 font-medium transition-colors duration-200">关于</a></li>
        <li><a href="/#projects" class="text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 font-medium transition-colors duration-200">项目</a></li>
        <li><a href="/#skills"   class="text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 font-medium transition-colors duration-200">技能</a></li>
        <li><a href="/#contact"  class="text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 font-medium transition-colors duration-200">联系</a></li>
        <li><span class="text-indigo-600 dark:text-indigo-400 font-medium">博客</span></li>
      </ul>

      <!-- 右侧：暗色切换 + 汉堡菜单 -->
      <div class="flex items-center gap-2">
        <theme-button size="1.5" aria-label="切换主题"></theme-button>

        <button type="button"
                class="md:hidden p-2 text-gray-600 dark:text-gray-300
                       hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-gray-100 dark:hover:bg-gray-800
                       rounded-lg transition-colors"
                aria-label="打开菜单" aria-expanded="false" aria-controls="mobile-menu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </nav>
  </header>

  <!-- ========== 文章列表 ========== -->
  <main>
    <section class="py-20 px-6 bg-gray-50 dark:bg-gray-950 min-h-screen">
      <div class="max-w-4xl mx-auto">
        <h1 class="font-display text-3xl font-bold mb-2 dark:text-white">全部文章</h1>
        <p class="text-gray-500 dark:text-gray-400 mb-12">学习笔记、踩坑记录、项目复盘</p>

        <div id="blog-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- 由 ../src/blog-list.js 动态渲染 -->
        </div>
      </div>
    </section>
  </main>

  <!-- ========== Footer ========== -->
  <footer class="bg-gray-900 dark:bg-black text-gray-400 dark:text-gray-500 py-10 px-6" role="contentinfo">
    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8 text-sm">
      <div>
        <p class="text-white dark:text-gray-200 font-bold mb-2">似水Sishui</p>
        <p>边学边做，在代码、物理与画笔之间探索世界。</p>
      </div>
      <div>
        <p class="text-white dark:text-gray-200 font-bold mb-2">快速链接</p>
        <ul class="space-y-1">
          <li><a href="/" class="hover:text-white dark:hover:text-gray-300 transition-colors">首页</a></li>
          <li><a href="/#projects" class="hover:text-white dark:hover:text-gray-300 transition-colors">项目</a></li>
          <li><span class="text-indigo-400">博客</span></li>
        </ul>
      </div>
      <div>
        <p class="text-white dark:text-gray-200 font-bold mb-2">社交链接</p>
        <ul class="space-y-1">
          <li><a href="https://github.com/sishui945" target="_blank" rel="noopener noreferrer"
                 class="hover:text-white dark:hover:text-gray-300 transition-colors">GitHub</a></li>
          <li><a href="https://space.bilibili.com/1909585735" target="_blank" rel="noopener noreferrer"
                 class="hover:text-white dark:hover:text-gray-300 transition-colors">B站</a></li>
          <li><a href="mailto:3693657762@qq.com"
                 class="hover:text-white dark:hover:text-gray-300 transition-colors">邮箱</a></li>
        </ul>
      </div>
    </div>
    <div class="max-w-6xl mx-auto mt-8 pt-6 border-t border-gray-800 dark:border-gray-800 text-center">
      <p>© 2026 似水Sishui · 使用 Vite + Tailwind CSS 构建</p>
    </div>
  </footer>

  <script type="module" src="/src/blog-list.js"></script>
</body>

</html>
