<!DOCTYPE html>
<html lang="zh-CN" style="scroll-behavior: smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>似水Sishui - 个人主页</title>
</head>

<!-- body 背景色同时定义浅色和暗色的默认值，配合 Tailwind darkMode: 'class' -->
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-sans antialiased">

  <!-- ========== 导航栏 ========== -->
  <!-- role="banner" 是 header 的隐式 ARIA 角色，显式声明更清晰 -->
  <header class="bg-white dark:bg-gray-900 shadow-sm sticky top-0 z-50">
    <nav class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center"
         aria-label="主导航">
      <!-- Logo -->
      <a href="#" class="flex items-center gap-2 text-2xl font-bold text-blue-600 dark:text-blue-400
                         tracking-tight hover:opacity-80 transition-opacity">
        <img src="./src/assets/logo.png" alt="似水Sishui 头像" class="w-8 h-8 rounded-md">
        <span class="text-xl font-bold text-gray-900 dark:text-white">似水Sishui</span>
      </a>

      <!-- 桌面端链接 -->
      <ul class="hidden md:flex items-center space-x-8">
        <li><a href="#home"
               class="text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400
                      font-medium transition-colors duration-200">首页</a></li>
        <li><a href="#about"
               class="text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400
                      font-medium transition-colors duration-200">关于</a></li>
        <li><a href="#skills"
               class="text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400
                      font-medium transition-colors duration-200">技能</a></li>
        <li><a href="#contact"
               class="text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400
                      font-medium transition-colors duration-200">联系</a></li>
      </ul>

      <!-- 右侧：暗色切换 + 汉堡菜单 -->
      <div class="flex items-center gap-2">
        <!-- 暗色模式切换按钮 —— JS 在 theme.js 中绑定点击事件 -->
        <button id="theme-toggle" type="button"
                class="p-2 text-lg rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
                aria-label="切换到暗色模式">
          🌙
        </button>

        <!-- 移动端汉堡按钮 —— aria-expanded 和 aria-controls 供屏幕阅读器使用 -->
        <button type="button"
                class="md:hidden p-2 text-gray-600 dark:text-gray-300
                       hover:text-blue-600 dark:hover:text-blue-400 hover:bg-gray-100 dark:hover:bg-gray-800
                       rounded-lg transition-colors"
                aria-label="打开菜单" aria-expanded="false" aria-controls="mobile-menu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </nav>
  </header>

  <!-- ========== 主内容区 ========== -->
  <!-- <main> 表示页面唯一主要内容，对屏幕阅读器和 SEO 友好 -->
  <main>

    <!-- ========== Hero 区域 ========== -->
    <section id="home" aria-labelledby="hero-heading"
             class="min-h-[80vh] flex flex-col items-center justify-center px-6 text-center
                    bg-gray-50 dark:bg-gray-950">
      <!-- 头像占位，aria-hidden 因为纯装饰 -->
      <div class="w-32 h-32 bg-gradient-to-br from-blue-400 to-purple-500 rounded-full mb-6 shadow-lg
                  flex items-center justify-center text-white text-4xl"
           aria-hidden="true">👤</div>

      <h1 id="hero-heading" class="text-4xl md:text-5xl font-bold text-gray-900 dark:text-white mb-4">
        你好，我是<span class="text-blue-600 dark:text-blue-400">追星者</span>
      </h1>

      <p class="text-lg md:text-xl text-gray-600 dark:text-gray-400 max-w-3xl leading-relaxed mb-8">
        正在学习 Web开发，Computer science，信息工程，游戏制作，绘画，弦论等
      </p>

      <div class="flex flex-col sm:flex-row gap-4">
        <a href="#skills"
           class="px-8 py-3 bg-blue-600 dark:bg-blue-500 text-white rounded-lg font-medium
                  hover:bg-blue-700 dark:hover:bg-blue-600 transition-colors shadow-md hover:shadow-lg">
          查看技能
        </a>
        <a href="#contact"
           class="px-8 py-3 border-2 border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300
                  rounded-lg font-medium hover:border-blue-600 dark:hover:border-blue-400
                  hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
          联系我
        </a>
      </div>
    </section>

    <!-- ========== 关于我 ========== -->
    <section id="about" aria-labelledby="about-heading"
             class="py-20 px-6 bg-white dark:bg-gray-900">
      <div class="max-w-3xl mx-auto text-center">
        <h2 id="about-heading" class="text-3xl font-bold mb-4 dark:text-white">关于我</h2>
        <p class="text-gray-600 dark:text-gray-400 text-lg leading-relaxed">
          正在学习 Web开发，Computer science，信息工程，游戏制作，绘画，弦论等。
          以项目驱动学习，边学边做，在实践中成长。
        </p>
      </div>
    </section>

    <!-- ========== 技能区域 ========== -->
    <!-- 技能卡片不再硬编码在 HTML 中，由 JS 从 src/data/skills.js 动态渲染 -->
    <section id="skills" aria-labelledby="skills-heading"
             class="py-20 px-6 bg-gray-50 dark:bg-gray-950">
      <div class="max-w-6xl mx-auto">
        <h2 id="skills-heading" class="text-3xl font-bold text-center mb-4 dark:text-white">技术栈</h2>
        <p class="text-gray-500 dark:text-gray-400 text-center mb-12">持续学习中，进度条代表当前掌握程度</p>

        <!-- JS 会把技能卡片渲染到这里 -->
        <!-- Grid 布局：手机1列，平板2列，桌面3列 -->
        <div id="skills-grid"
             class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- 由 src/render.js:renderSkills() 动态填充 -->
        </div>
      </div>
    </section>

    <!-- ========== 联系我 ========== -->
    <!-- 联系卡片也不再硬编码，由 JS 从 src/data/contact.js 动态渲染 -->
    <section id="contact" aria-labelledby="contact-heading"
             class="py-20 px-6 bg-white dark:bg-gray-900">
      <div class="max-w-4xl mx-auto text-center">
        <h2 id="contact-heading" class="text-3xl font-bold mb-4 dark:text-white">联系我</h2>
        <p class="text-gray-500 dark:text-gray-400 mb-12">欢迎通过以下方式找到我</p>

        <!-- JS 会把联系卡片渲染到这里 -->
        <div id="contact-grid"
             class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <!-- 由 src/render.js:renderContact() 动态填充 -->
        </div>
      </div>
    </section>

  </main>

  <!-- ========== Footer ========== -->
  <footer class="bg-gray-900 dark:bg-black text-gray-400 dark:text-gray-500 py-8 px-6 text-center"
          role="contentinfo">
    <p>© 2026 似水Sishui. 正在构建中...</p>
  </footer>

  <!-- ES Module 入口 —— Vite 从这里开始加载所有 JS -->
  <script type="module" src="/src/main.js"></script>
</body>

</html>
